name = "caphe-install-worker"
main = "index.ts"
compatibility_date = "2026-10-01"

# Create the namespace once:  wrangler kv namespace create CAFE_CONFIG
# then paste the returned id here.
[[kv_namespaces]]
binding = "CAFE_CONFIG"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Wildcard route on your apex domain (free plan: set a wildcard DNS record
# that points at the worker custom domain).
# [[routes]]
# pattern = "*.yourdomain.com"
# custom_domain = true
